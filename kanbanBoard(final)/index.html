<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kanban Board</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">
        <link rel="shortcut icon" href="./kanbanFavIcon.webp" type="image/x-icon">
</head>

<body>
    <main>
        <header>
            <div>
                <h1>Kanban Board</h1>
            </div>
            <!-- Theme switcher buttons start -->
            <div class="theme-switcher">
                <span style="font-weight: bold; letter-spacing: 1px;">Theme:</span>
                <button type="button" class="theme-btn" data-theme="default">Default</button>
                <button type="button" class="theme-btn" data-theme="pastel-pink">Pastel</button>
                <button type="button" class="theme-btn" data-theme="warm-peach">Peach</button>
                <button type="button" class="theme-btn" data-theme="retro-calm">Retro</button>
            </div>
            <button class="addNewTaskBtn">Add new task</button>
        </header>
        <div class="board">
            <div class="overlay hidden" id="overlay">
                <div class="modal">

                    <h2>Create New Task</h2>

                    <input type="text" id="taskTitle" placeholder="Task title">

                    <textarea id="taskDesc" placeholder="Task description"></textarea>

                    <div class="actions">
                        <button id="cancelBtn">Cancel</button>
                        <button id="createBtn">Create</button>
                    </div>

                </div>
            </div>
            <div class="column " id="todo">
                <div class="top">
                    <div class="left">
                        <p>Todo</p>
                    </div>
                    <div class="right">
                        <p class="count">0</p>
                    </div>
                </div>
                <div class="allTasks">

                </div>
            </div>
            <div class="column" id='progress'>
                <div class="top">
                    <div class="left">
                        <p>In Progress</p>
                    </div>
                    <div class="right">
                        <p class="count">2</p>
                    </div>
                </div>
                <div class="allTasks">

                </div>
            </div>
            <div class="column" id="done">
                <div class="top">
                    <div class="left">
                        <p>Done</p>
                    </div>
                    <div class="right">
                        <p class="count">4</p>
                    </div>
                </div>
                <div class="allTasks">

                </div>
            </div>
        </div>
    </main>
    <script src="script.js"></script>
</body>

</html>
